      @keyframes plezzyOverlayIn {
        0% {

          backdrop-filter: blur(0px) saturate(100%);

        100% {
          opacity: 1;
          backdrop-filter: blur(50px) saturate(200%) brightness(1.06);

          transform: scale(1);
        }
      }

        0% {
          opacity: 1;
          backdrop-filter: blur(50px) saturate(200%) brightness(1.06);
          -webkit-backdrop-filter: blur(50px) saturate(200%) brightness(1.06);
          transform: scale(1);
        }
        100% {
          opacity: 0;
          backdrop-filter: blur(0px) saturate(100%);

      </button>

      <!-- Expanded Floating Card -->
      <div id="mobile-connect-modal" style="display: none; position: absolute; bottom: 0; right: 0; width: 330px; background: rgba(18, 18, 18, 0.98); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1.5px solid rgba(255,255,255,0.2); border-radius: 24px; padding: 20px; box-shadow: 0 24px 60px rgba(0,0,0,0.65); color: #ffffff; text-align: left; box-sizing: border-box;">
        <div style="display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.12); padding-bottom: 10px; margin-bottom: 12px;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <span style="font-size: 16px;">📱</span>
            <span style="font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em;">Mobile Preview</span>
          </div>
          <button onclick="toggleMobileModal(false)" style="background: rgba(255,255,255,0.12); border: none; color: #ffffff; width: 26px; height: 26px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold;" title="Close">✕</button>
        </div>

        <!-- Network Mode Tabs -->
        <div style="display: flex; gap: 6px; background: rgba(255,255,255,0.06); padding: 4px; border-radius: 12px; margin-bottom: 12px;">
          <button id="tab-cloud-btn" onclick="selectMobileMode('cloud')" style="flex: 1; padding: 6px 8px; font-size: 11px; font-weight: 700; border-radius: 8px; border: none; cursor: pointer; background: #ffffff; color: #141414; transition: all 0.2s;">🌐 Cloud Link (4G/5G/Anywhere)</button>
          <button id="tab-lan-btn" onclick="selectMobileMode('lan')" style="flex: 1; padding: 6px 8px; font-size: 11px; font-weight: 700; border-radius: 8px; border: none; cursor: pointer; background: transparent; color: rgba(255,255,255,0.7); transition: all 0.2s;">📶 Same Wi-Fi</button>
        </div>

        <p id="mobile-help-text" style="font-size: 11.5px; color: rgba(255,255,255,0.75); line-height: 1.4; margin: 0 0 12px 0;">
          Scan with your phone camera (works on ANY mobile phone, 4G, 5G, or Wi-Fi):
        </p>

        <!-- QR Code Frame -->
        <div style="background: #ffffff; padding: 12px; border-radius: 18px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px; box-shadow: inset 0 2px 8px rgba(0,0,0,0.15);">
          <img id="mobile-qr-img" src="/api/qr.svg?url=https%3A%2F%2Ftribes-functions-nation-copyrights.trycloudflare.com%2F" alt="Plezzy Mobile QR Code" style="width: 180px; height: 180px; display: block; border-radius: 8px;" />
        </div>

        <!-- Copyable Address Pill -->
        <div style="background: rgba(255,255,255,0.08); border-radius: 12px; padding: 8px 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px;">
          <span id="mobile-url-text" style="font-family: monospace; font-size: 10.5px; color: #ffffff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; user-select: all;">https://tribes-functions-nation-copyrights.trycloudflare.com/</span>
          <button id="copy-mobile-btn" onclick="copyMobileUrl()" style="background: #ff2a85; color: #ffffff; border: none; border-radius: 8px; padding: 6px 12px; font-size: 10.5px; font-weight: 800; text-transform: uppercase; cursor: pointer; shrink: 0; transition: background-color 0.2s;">Copy</button>
        </div>
        <p id="mobile-footer-tip" style="font-size: 10px; color: #22c55e; text-align: center; margin: 0; font-weight: 600;">✓ Connected via Cloud HTTPS tunnel (accessible anywhere globally)</p>
      </div>
    </div>

    <script>
      // Mobile Connect Widget Controller
      (function() {
        var widget = document.getElementById('mobile-connect-widget');
        var pill = document.getElementById('mobile-connect-pill');
        var modal = document.getElementById('mobile-connect-modal');
        var lanUrl = 'http://192.168.1.6:3000/';
        var cloudUrl = 'https://tribes-functions-nation-copyrights.trycloudflare.com/';
        var activeMode = 'cloud';

        function checkScreen() {
          var isLocal = window.location.hostname === 'localhost' || 
                        window.location.hostname === '127.0.0.1' || 
                        window.location.hostname.startsWith('192.168.') ||
                        window.location.hostname.startsWith('10.') ||
                        window.location.hostname.endsWith('.local') ||
                        window.location.hostname.endsWith('.pinggy.net') ||
                        window.location.hostname.endsWith('.trycloudflare.com');
          if (window.innerWidth >= 768 && isLocal) {
            widget.style.display = 'block';
          } else {
            widget.style.display = 'none';
          }
        }
        checkScreen();
        window.addEventListener('resize', checkScreen);

        window.toggleMobileModal = function(show) {
          if (show) {
            pill.style.display = 'none';
            modal.style.display = 'block';
            refreshMobileInfo();
          } else {
            modal.style.display = 'none';
            pill.style.display = 'flex';
          }
        };

        window.selectMobileMode = function(mode) {
          activeMode = mode;
          var tabLan = document.getElementById('tab-lan-btn');
          var tabCloud = document.getElementById('tab-cloud-btn');
          var helpText = document.getElementById('mobile-help-text');
          var urlText = document.getElementById('mobile-url-text');
          var qrImg = document.getElementById('mobile-qr-img');
          var footerTip = document.getElementById('mobile-footer-tip');

          if (mode === 'lan') {
            tabLan.style.background = '#ffffff';
            tabLan.style.color = '#141414';
            tabCloud.style.background = 'transparent';
            tabCloud.style.color = 'rgba(255,255,255,0.7)';
            helpText.innerText = 'Scan with your phone camera (must be connected to same Wi-Fi):';
            urlText.innerText = lanUrl;
            qrImg.src = '/api/qr.svg?url=' + encodeURIComponent(lanUrl) + '&t=' + Date.now();
            footerTip.innerText = '(Tip: If phone is on cellular 4G/5G, switch to "Cloud Link" above)';
            footerTip.style.color = 'rgba(255,255,255,0.5)';
          } else {
            tabCloud.style.background = '#ffffff';
            tabCloud.style.color = '#141414';
            tabLan.style.background = 'transparent';
            tabLan.style.color = 'rgba(255,255,255,0.7)';
            helpText.innerText = 'Scan with your phone camera (works on ANY network, cellular 4G/5G or Wi-Fi):';
            var target = cloudUrl || 'https://tribes-functions-nation-copyrights.trycloudflare.com/';
            urlText.innerText = target;
            qrImg.src = '/api/qr.svg?url=' + encodeURIComponent(target) + '&t=' + Date.now();
            footerTip.innerText = '✓ Connected via Cloud HTTPS tunnel (accessible anywhere globally)';
            footerTip.style.color = '#22c55e';
          }
        };

        window.copyMobileUrl = function() {
          var url = document.getElementById('mobile-url-text').innerText;
          navigator.clipboard.writeText(url).then(function() {
            var btn = document.getElementById('copy-mobile-btn');
            btn.innerText = 'Copied!';
            btn.style.backgroundColor = '#22c55e';
            setTimeout(function() {
              btn.innerText = 'Copy';
              btn.style.backgroundColor = '#ff2a85';
            }, 2000);
          });
        };

        function refreshMobileInfo() {
          fetch('/__plezzy_info?t=' + Date.now())
            .then(function(res) { return res.json(); })
            .then(function(data) {
              if (data) {
                if (data.lanUrl) lanUrl = data.lanUrl;
                if (data.tunnelUrl) cloudUrl = data.tunnelUrl;

                if (activeMode === 'cloud' && cloudUrl) {
                  document.getElementById('mobile-url-text').innerText = cloudUrl;
                  document.getElementById('mobile-qr-img').src = '/api/qr.svg?url=' + encodeURIComponent(cloudUrl) + '&t=' + Date.now();
                } else if (activeMode === 'lan' && lanUrl) {
                  document.getElementById('mobile-url-text').innerText = lanUrl;
                  document.getElementById('mobile-qr-img').src = '/api/qr.svg?url=' + encodeURIComponent(lanUrl) + '&t=' + Date.now();
                }
              }
            })
            .catch(function(e) { console.error('Error fetching mobile info:', e); });
        }

        // Initial fetch
        refreshMobileInfo();
      })();
      // ══════════════════════════════════════════════════════════════
      // SCROLL-DRIVEN LUXURY REVEAL CONTROLLER (INTERSECTION OBSERVER)
      // ══════════════════════════════════════════════════════════════
      (function() {
        if (typeof window === 'undefined' || !('IntersectionObserver' in window)) return;

        var observer = new IntersectionObserver(function(entries) {
          entries.forEach(function(entry) {
            if (entry.isIntersecting) {
              entry.target.classList.add('is-revealed');
              observer.unobserve(entry.target);
            }
          });
        }, {
          root: null,
          rootMargin: '0px 0px -40px 0px',
          threshold: 0.08
        });

        function registerElements() {
          var selectors = [
            '#hero-left-content',
            '#plezzy-ticker-marquee-bar',
            '#plezzy-editorial-products-grid',
            '.plezzy-bento-card',
            '.plezzy-divider-cta-wrap',
            '#editorial-collection-split',
            '.split-panel-editorial',
            '#campaign-video',
            '#community',
            '#newsletter',
            'footer'
          ];

          selectors.forEach(function(sel) {
            document.querySelectorAll(sel).forEach(function(el) {
              if (!el.classList.contains('reveal-on-scroll')) {
                el.classList.add('reveal-on-scroll');
              }
              if (!el.classList.contains('is-revealed')) {
                observer.observe(el);
              }
            });
          });
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', registerElements);
        } else {
          registerElements();
        }

        var domObserver = new MutationObserver(function() {
          registerElements();
        });
        domObserver.observe(document.body, { childList: true, subtree: true });
      })();
    </script>
  </body>
</html>
