    <script>
      /* Clean URL standard navigation: strip index.html and .html extensions */
      (function() {
        try {
          var p = window.location.pathname;
          if (p === "/index.html" || p.endsWith("/index.html")) {
            var c = p.replace(/\/index\.html$/, "/") || "/";
            window.history.replaceState(null, "", c + window.location.search + window.location.hash);
          } else if (p.endsWith(".html")) {
            var c = p.replace(/\.html$/, "");
            window.history.replaceState(null, "", c + window.location.search + window.location.hash);
          }
        } catch(e) {}
      })();
    </script>

    <script>
      (function() {
        try {
          var isVerified = localStorage.getItem("plezzy_age_verified") === "true";
          var overlay = document.getElementById("plezzy-age-gate-overlay");
          if (isVerified && overlay) {
            overlay.style.display = "none";
          } else if (overlay) {
            overlay.style.display = "flex";
            document.documentElement.style.overflow = "hidden";
            document.body.style.overflow = "hidden";
          }
        } catch(e) {}
      })();

      function verifyPlezzyAge() {
        try {
          localStorage.setItem("plezzy_age_verified", "true");
        } catch(e) {}
        var overlay = document.getElementById("plezzy-age-gate-overlay");
        if (overlay) {
          overlay.style.opacity = "0";
          overlay.style.transition = "opacity 0.25s ease";
          setTimeout(function() {
            overlay.style.display = "none";
            document.documentElement.style.overflow = "";
            document.body.style.overflow = "";
          }, 250);
        }
      }
    </script>
